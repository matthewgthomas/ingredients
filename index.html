<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Ingredient Atlas — origins & where they grow</title>
  <meta name="description" content="An interactive map of where common food ingredients came from and where they are grown and produced today." />

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar">
      <header id="brand">
        <h1>Ingredient&nbsp;Atlas</h1>
        <p class="tagline">Where the world's ingredients came from &mdash; and where they grow now.</p>
      </header>

      <div class="controls">
        <div class="search-wrap">
          <input id="search" type="search" placeholder="Search ingredients…" autocomplete="off" />
          <button id="clear-search" title="Clear" aria-label="Clear search">&times;</button>
        </div>

        <div class="mode-toggle" role="group" aria-label="What to show">
          <button data-mode="both" class="active">Origin &amp; growers</button>
          <button data-mode="origin">Origins</button>
          <button data-mode="producers">Growers</button>
        </div>
      </div>

      <div id="category-filter" class="category-filter"></div>

      <div id="list" class="ingredient-list" role="listbox" aria-label="Ingredients"></div>

      <footer id="side-footer">
        <button id="reset-view" class="link-btn">Show all origins</button>
        <p class="disclaimer">Origins are approximate and some are debated; production figures are indicative. Built for exploration, not citation.</p>
      </footer>
    </aside>

    <!-- Map + detail -->
    <main id="map-area">
      <div id="map"></div>

      <div id="detail" class="detail hidden" aria-live="polite">
        <button id="detail-close" aria-label="Close">&times;</button>
        <span id="detail-cat" class="detail-cat">Category</span>
        <h2 id="detail-name">Ingredient</h2>
        <div class="detail-section">
          <h3><span class="dot origin-dot"></span> Origin</h3>
          <p id="detail-origin-place" class="detail-place"></p>
          <p id="detail-origin-era" class="detail-era"></p>
          <p id="detail-origin-note" class="detail-note"></p>
        </div>
        <div class="detail-section">
          <h3><span class="dot producer-dot"></span> Main growers today</h3>
          <ul id="detail-producers" class="producer-list"></ul>
        </div>
      </div>

      <button id="mobile-list-toggle" aria-label="Browse ingredients">☰ Ingredients</button>
    </main>
  </div>

  <script src="data/ingredients.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
